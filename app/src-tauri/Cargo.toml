[package]
name = "widget-platform-app"
version = "0.1.0"
description = "Local Windows desktop information and interaction host"
authors = ["Widget Platform"]
edition = "2021"
rust-version = "1.85"

[features]
g2c-probe = []

[lib]
name = "widget_platform_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.6", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.5"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "system-proxy"] }
tokio = { version = "=1.53.1", features = ["macros", "time"] }
chrono-tz = "=0.10.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = ["Foundation", "Devices_Geolocation", "deprecated", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
iana-time-zone = "=0.1.65"
windows-future = "=0.2.1"
